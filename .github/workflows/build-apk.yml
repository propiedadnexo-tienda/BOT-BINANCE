name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['tools/**', 'research/**', '.github/workflows/research.yml', 'README.md']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: |
          [ -d android ] || npx cap add android
          npx cap sync android

      - name: Compilar APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BotBinance.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bot-binance-apk
          path: BotBinance.apk

      # Publica el APK como descarga directa (sin zip ni inicio de sesión):
      # https://github.com/<usuario>/<repo>/releases/latest/download/BotBinance.apk
      - name: Publicar descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" BotBinance.apk \
            --title "Bot Binance $TAG" \
            --notes "Toca BotBinance.apk para descargar e instalar en Android." \
            --latest
